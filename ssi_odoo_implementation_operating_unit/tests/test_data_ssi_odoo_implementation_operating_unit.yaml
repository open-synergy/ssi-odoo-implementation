scenarios:
  - name: "Odoo Implementation - Operating Unit is set"
    steps:
      - step: "Setup - create odoo version"
        action: "create"
        model: "odoo_version"
        save_as: "version"
        values:
          name: "Odoo 14.0 OU"
          code: "14OU"

      - step: "Setup - create odoo environment"
        action: "create"
        model: "odoo_environment"
        save_as: "environment"
        values:
          name: "Production OU"
          code: "PRODOU"

      - step: "Create odoo implementation with operating_unit_id"
        action: "create"
        model: "odoo_implementation"
        save_as: "implementation"
        as_user: "base.user_admin"
        values:
          domain: "ou-test.example.com"
          version_id: "EVAL: registry['version'].id"
          environment_id: "EVAL: registry['environment'].id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert implementation operating_unit_id is set"
        action: "assert"
        target: "implementation"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Odoo Change Request - Operating Unit is set"
    steps:
      - step: "Setup - create odoo version"
        action: "create"
        model: "odoo_version"
        save_as: "version"
        values:
          name: "Odoo 14.0 CR OU"
          code: "14CROU"

      - step: "Create odoo change request with operating_unit_id"
        action: "create"
        model: "odoo_change_request"
        save_as: "change_request"
        as_user: "base.user_admin"
        values:
          summary: "Test Change Request OU"
          version_id: "EVAL: registry['version'].id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert change request operating_unit_id is set"
        action: "assert"
        target: "change_request"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

