scenarios:
  - name: "Odoo Implementation Infrastructure - server_id field available"
    steps:
      - step: "Setup - create odoo version"
        action: "create"
        model: "odoo_version"
        save_as: "version"
        values:
          name: "Odoo 14.0 Infra"
          code: "14INFRA"

      - step: "Setup - create odoo environment"
        action: "create"
        model: "odoo_environment"
        save_as: "environment"
        values:
          name: "Production Infra"
          code: "PRODINFRA"

      - step: "Create odoo implementation with infrastructure extension"
        action: "create"
        model: "odoo_implementation"
        save_as: "implementation"
        as_user: "base.user_admin"
        values:
          domain: "infra.example.com"
          version_id: "EVAL: registry['version'].id"
          environment_id: "EVAL: registry['environment'].id"

      - step: "Assert implementation created with server_id field"
        action: "assert"
        target: "implementation"
        asserts:
          state:
            type: "value"
            expected: "draft"
