scenarios:
  - name: "Odoo Implementation Git - git_repo_id field available"
    steps:
      - step: "Setup - create odoo version"
        action: "create"
        model: "odoo_version"
        save_as: "version"
        values:
          name: "Odoo 14.0 Git"
          code: "14GIT"

      - step: "Setup - create odoo environment"
        action: "create"
        model: "odoo_environment"
        save_as: "environment"
        values:
          name: "Production Git"
          code: "PRODGIT"

      - step: "Create odoo implementation with git extension"
        action: "create"
        model: "odoo_implementation"
        save_as: "implementation"
        as_user: "base.user_admin"
        values:
          domain: "git.example.com"
          version_id: "EVAL: registry['version'].id"
          environment_id: "EVAL: registry['environment'].id"

      - step: "Assert implementation created with git_repo_id field"
        action: "assert"
        target: "implementation"
        asserts:
          state:
            type: "value"
            expected: "draft"
